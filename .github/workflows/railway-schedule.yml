name: Railway Bot Schedule

on:
  schedule:
    # 08:00 IST
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"

    # TEMPORARY: 10:00 IST
    - cron: "30 10 * * *"
      timezone: "Asia/Kolkata"

    # 00:00 IST
    - cron: "0 0 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:
    inputs:
      action:
        description: "Choose what to do with the Railway bot"
        required: true
        type: choice
        options:
          - start
          - stop

concurrency:
  group: railway-bot-schedule
  cancel-in-progress: false

jobs:
  manage:
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # Determine action
      # =========================================================

      - name: Determine action
        id: action
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MANUAL_ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            ACTION="$MANUAL_ACTION"

          elif [ "$SCHEDULE" = "0 8 * * *" ]; then
            ACTION="start"

          elif [ "$SCHEDULE" = "0 10 * * *" ]; then
            ACTION="start"

          elif [ "$SCHEDULE" = "0 0 * * *" ]; then
            ACTION="stop"

          else
            echo "Unknown schedule: $SCHEDULE"
            exit 1
          fi

          echo "Schedule: ${SCHEDULE:-manual}"
          echo "Action: $ACTION"

          echo "action=$ACTION" >> "$GITHUB_OUTPUT"

      # =========================================================
      # Get latest deployment
      # =========================================================

      - name: Get latest deployment
        id: deployment
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "https://backboard.railway.com/graphql/v2" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg projectId "$PROJECT_ID" \
              --arg serviceId "$SERVICE_ID" \
              '{
                query: "query deployments($input: DeploymentListInput!, $first: Int) { deployments(input: $input, first: $first) { edges { node { id status createdAt updatedAt } } } }",
                variables: {
                  input: {
                    projectId: $projectId,
                    serviceId: $serviceId
                  },
                  first: 10
                }
              }')")

          echo "$RESPONSE" | jq .

          if echo "$RESPONSE" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
            echo "Railway returned GraphQL errors."
            exit 1
          fi

          DEPLOYMENT=$(echo "$RESPONSE" | jq -c '
            .data.deployments.edges
            | map(.node)
            | sort_by(.createdAt)
            | reverse
            | .[0]
          ')

          if [ -z "$DEPLOYMENT" ] || [ "$DEPLOYMENT" = "null" ]; then
            echo "No deployment found."
            exit 1
          fi

          DEPLOYMENT_ID=$(echo "$DEPLOYMENT" | jq -r '.id')
          STATUS=$(echo "$DEPLOYMENT" | jq -r '.status')
          CREATED_AT=$(echo "$DEPLOYMENT" | jq -r '.createdAt')

          echo "Latest deployment: $DEPLOYMENT_ID"
          echo "Railway status: $STATUS"
          echo "Created: $CREATED_AT"

          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      # =========================================================
      # STOP
      #
      # Do NOT check STATUS == SUCCESS.
      #
      # Railway can retain SUCCESS after a deployment has been
      # stopped, so the status cannot reliably tell us whether
      # the container is actually running.
      # =========================================================

      - name: Stop bot
        if: steps.action.outputs.action == 'stop'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail

          echo "Stopping deployment:"
          echo "$DEPLOYMENT_ID"

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "https://backboard.railway.com/graphql/v2" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg id "$DEPLOYMENT_ID" \
              '{
                query: "mutation deploymentStop($id: String!) { deploymentStop(id: $id) }",
                variables: {
                  id: $id
                }
              }')")

          echo "$RESPONSE" | jq .

          if echo "$RESPONSE" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
            echo "Railway failed to stop the deployment."
            exit 1
          fi

          RESULT=$(echo "$RESPONSE" | jq -r '.data.deploymentStop')

          if [ "$RESULT" != "true" ]; then
            echo "Railway did not confirm the stop request."
            exit 1
          fi

          echo "Bot stop request completed successfully."

      # =========================================================
      # START / RESTART
      #
      # Do NOT check STATUS == SUCCESS.
      #
      # Always restart the latest deployment.
      # =========================================================

      - name: Start bot
        if: steps.action.outputs.action == 'start'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.deployment_id }}
        run: |
          set -euo pipefail

          echo "Restarting deployment:"
          echo "$DEPLOYMENT_ID"

          RESPONSE=$(curl -sS \
            --fail-with-body \
            -X POST \
            "https://backboard.railway.com/graphql/v2" \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$(jq -n \
              --arg id "$DEPLOYMENT_ID" \
              '{
                query: "mutation deploymentRestart($id: String!) { deploymentRestart(id: $id) }",
                variables: {
                  id: $id
                }
              }')")

          echo "$RESPONSE" | jq .

          if echo "$RESPONSE" | jq -e '.errors and (.errors | length > 0)' >/dev/null; then
            echo "Railway failed to restart the deployment."
            exit 1
          fi

          RESULT=$(echo "$RESPONSE" | jq -r '.data.deploymentRestart')

          if [ "$RESULT" != "true" ]; then
            echo "Railway did not confirm the restart request."
            exit 1
          fi

          echo "Bot restart request completed successfully."
